name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # CI runs against SQLite so no database service is needed. These are
      # throwaway values; real secrets live in the deployment environment.
      SECRET_KEY: ci-test-secret-key
      DEBUG: "True"
      DATABASE_ENGINE: django.db.backends.sqlite3
      DATABASE_NAME: ci.sqlite3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: System check
        run: python manage.py check
      - name: Migrations are in sync
        run: python manage.py makemigrations --check --dry-run
      - name: Test suite
        run: python manage.py test --verbosity=2
      - name: Dependency audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt || true  # report, don't block the build

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Dependency audit
        run: npm audit --omit=dev || true  # report prod-dep issues, don't block
